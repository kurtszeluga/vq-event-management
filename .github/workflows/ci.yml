name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result instead of cancelling siblings on the
      # first failure, so one broken version cannot hide another's status.
      fail-fast: false
      matrix:
        # Match the Vercel runtime (see engines.node in package.json). This
        # app deploys to one known runtime, so CI tests that runtime rather
        # than a spread of versions nothing actually runs on.
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Client tests
        run: npm run test:client

      # The Firestore and Storage emulators both run on the JVM, so the rules
      # suite needs a JDK that the other steps do not.
      - name: Set up Java for the Firestore/Storage emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Rules tests
        run: npm run test:rules
