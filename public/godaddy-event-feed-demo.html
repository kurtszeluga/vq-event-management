<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Village Quilters Event Feed</title>
    <style>
      body {
        background: #f4efe8;
        color: #1d2927;
        font-family: Inter, Arial, sans-serif;
        margin: 0;
        padding: 32px 18px 48px;
      }
      .demo-shell {
        margin: 0 auto;
        max-width: 1120px;
      }
      .demo-header {
        margin-bottom: 24px;
      }
      .demo-header h1 {
        font-size: 2rem;
        margin: 0 0 8px;
      }
      .demo-header p {
        line-height: 1.5;
        margin: 0;
        max-width: 760px;
      }
    </style>
  </head>
  <body>
    <!--
      Setup reference - not shown on the page, so this stays presentable for a
      live demo. To embed a feed in a GoDaddy HTML block, paste a mount div
      plus the script tag:

        <div data-vq-feed data-category="events"></div>
        <script src="https://test.villagequilters.com/godaddy-event-feed.js" defer></script>

      One page per listing type:

        Programs & Workshops
        <div data-vq-feed data-category="programs" data-categories="programs,workshops" data-layout="roster"></div>

        Challenges
        <div data-vq-feed data-category="challenges" data-categories="challenges" data-layout="roster"></div>

        For Sale
        <div data-vq-feed data-category="forsale" data-categories="forsale" data-layout="grid"></div>

        Business Listings
        <div data-vq-feed data-category="business" data-categories="business" data-layout="grid"></div>

      data-category picks which listings load (programs, workshops, challenges,
      business, forsale). data-categories limits the pill row above the feed;
      listing a single value hides that row, which is how a page is pinned to
      one kind of listing. data-layout picks the card geometry: roster, grid or
      agenda. Adding data-layout-switcher (presence alone is enough, no value
      needed) puts a Roster/Grid/Agenda row above the feed so the three can be
      compared on the live page - drop that attribute once a layout is settled
      and the feed renders the chosen one with no controls.

      There is deliberately no data-source-url: the feed calls
      /api/public-events on whichever host served the script, so the script tag
      is the only URL on a page. AT GO-LIVE, change `test` to `events` in that
      tag on every page - test.villagequilters.com serves test listings and
      sends registrants to the Square sandbox. Never use the raw
      vq-event-management.vercel.app URL; it serves production with no warning.
    -->
    <main class="demo-shell">
      <header class="demo-header">
        <h1>Village Quilters Event Feed</h1>
        <p>
          The guild&rsquo;s programs, workshops, challenges, business listings and for-sale items,
          published straight from the events system to the website. Use the buttons below to
          compare the three card layouts.
        </p>
      </header>

      <!-- The Roster/Grid/Agenda row below the pills comes from the embed
           itself, via data-layout-switcher - this page adds no JS of its own,
           so what is on screen here is exactly what a GoDaddy page carrying
           the same attribute will show. -->
      <div
        data-vq-feed
        data-category="events"
        data-layout-switcher
        data-source-url="/api/public-events"
      ></div>
    </main>

    <script src="/godaddy-event-feed.js" defer></script>
  </body>
</html>
