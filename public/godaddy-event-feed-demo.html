<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Village Quilters Event Feed</title>
    <style>
      body {
        background: #f4efe8;
        color: #1d2927;
        font-family: Inter, Arial, sans-serif;
        margin: 0;
        padding: 32px 18px 48px;
      }
      .demo-shell {
        margin: 0 auto;
        max-width: 1120px;
      }
      .demo-header {
        margin-bottom: 24px;
      }
      .demo-header h1 {
        font-size: 2rem;
        margin: 0 0 8px;
      }
      .demo-header p {
        line-height: 1.5;
        margin: 0;
        max-width: 760px;
      }
      .demo-switcher {
        align-items: center;
        border-bottom: 1px solid #ded5ca;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 18px;
        padding: 0 0 16px;
      }
      .demo-switcher-label {
        font-weight: 700;
        margin-right: 4px;
      }
      /* Matched to the feed's own category pills so the two rows of controls
         on this page read as one control, not two styles. */
      .demo-switcher button {
        appearance: none;
        background: #ffffff;
        border: 1px solid #c8d4d0;
        border-radius: 999px;
        color: #1d2927;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 10px 16px;
      }
      .demo-switcher button:hover {
        border-color: #225c56;
      }
      .demo-switcher button.is-active {
        background: #225c56;
        border-color: #225c56;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <!--
      Setup reference - not shown on the page, so this stays presentable for a
      live demo. To embed a feed in a GoDaddy HTML block, paste a mount div
      plus the script tag:

        <div data-vq-feed data-category="events"></div>
        <script src="https://test.villagequilters.com/godaddy-event-feed.js" defer></script>

      One page per listing type:

        Programs & Workshops
        <div data-vq-feed data-category="programs" data-categories="programs,workshops" data-layout="roster"></div>

        Challenges
        <div data-vq-feed data-category="challenges" data-categories="challenges" data-layout="roster"></div>

        For Sale
        <div data-vq-feed data-category="forsale" data-categories="forsale" data-layout="grid"></div>

        Business Listings
        <div data-vq-feed data-category="business" data-categories="business" data-layout="grid"></div>

      data-category picks which listings load (programs, workshops, challenges,
      business, forsale). data-categories limits the pill row above the feed;
      listing a single value hides that row, which is how a page is pinned to
      one kind of listing. data-layout picks the card geometry: roster, grid or
      agenda.

      There is deliberately no data-source-url: the feed calls
      /api/public-events on whichever host served the script, so the script tag
      is the only URL on a page. AT GO-LIVE, change `test` to `events` in that
      tag on every page - test.villagequilters.com serves test listings and
      sends registrants to the Square sandbox. Never use the raw
      vq-event-management.vercel.app URL; it serves production with no warning.
    -->
    <main class="demo-shell">
      <header class="demo-header">
        <h1>Village Quilters Event Feed</h1>
        <p>
          The guild&rsquo;s programs, workshops, challenges, business listings and for-sale items,
          published straight from the events system to the website. Use the buttons below to
          compare the three card layouts.
        </p>
      </header>

      <div class="demo-switcher" role="group" aria-label="Card layout">
        <span class="demo-switcher-label">Layout:</span>
        <button aria-pressed="true" class="is-active" type="button" data-demo-layout="roster">Roster</button>
        <button aria-pressed="false" type="button" data-demo-layout="grid">Grid</button>
        <button aria-pressed="false" type="button" data-demo-layout="agenda">Agenda</button>
      </div>

      <div
        data-vq-feed
        data-category="events"
        data-source-url="/api/public-events"
      ></div>
    </main>

    <script src="/godaddy-event-feed.js" defer></script>
    <script>
      // The layout is pure CSS on .vq-feed-list, so switching it is a class
      // swap rather than a re-render - which is also why an embed can change
      // layout without refetching anything.
      //
      // Applied on a delay-free re-read of .vq-feed-list each time rather than
      // cached: the feed replaces that element wholesale when the reader
      // switches category pills, so a held reference would go stale.
      const layoutButtons = Array.from(document.querySelectorAll('[data-demo-layout]'));

      function applyLayout(layout) {
        document.querySelectorAll('.vq-feed-list').forEach((list) => {
          list.classList.remove('is-roster', 'is-grid', 'is-agenda');
          list.classList.add(`is-${layout}`);
        });
      }

      layoutButtons.forEach((button) => {
        button.addEventListener('click', () => {
          layoutButtons.forEach((item) => {
            const isActive = item === button;
            item.classList.toggle('is-active', isActive);
            item.setAttribute('aria-pressed', String(isActive));
          });

          applyLayout(button.dataset.demoLayout);
        });
      });

      // Switching category pills re-renders the list with the embed's own
      // default layout, which would silently undo the selection above.
      document.addEventListener('click', (event) => {
        if (!event.target.closest('.vq-feed-category')) {
          return;
        }

        const active = layoutButtons.find((button) => button.classList.contains('is-active'));

        if (active) {
          window.setTimeout(() => applyLayout(active.dataset.demoLayout), 400);
        }
      });
    </script>
  </body>
</html>
